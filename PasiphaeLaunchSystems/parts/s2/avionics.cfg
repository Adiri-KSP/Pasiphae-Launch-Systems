		{
			name = ElectricCharge
			rate = 0.020
		}
		hasHibernation = True
	}
	
	RESOURCE
	{
		name = ElectricCharge
		amount = 713.4
		maxAmount = 713.4
	}
	
	MODULE
	{
		name = ModuleReactionWheel
		PitchTorque = 2
		YawTorque = 2
		RollTorque = 2
		RESOURCE
		{
			name = ElectricCharge
			rate = 0.05
		}
	}

	MODULE 
    {
		name = ModuleSAS
		SASServiceLevel = 3
	}
	
	MODULE 
    {
		name = ModuleDataTransmitter
		antennaType = INTERNAL
		packetInterval = 1.0
		packetSize = 2
		packetResourceCost = 12.0
		requiredResource = ElectricCharge
		antennaPower = 5000
		optimumRange = 2500
		packetFloor = .1
		packetCeiling = 5
	}
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = textureSwitchPaint
		switcherDescription = Paint Switch
		switcherDescriptionPlural = Paint Switches
		SUBTYPE
		{
			name = grey
			title = Grey P.O.F.I
			primaryColor = #AAA8A5
			secondaryColor = #AAA8A5
			descriptionSummary = The default option.
			TEXTURE
			{
				texture = PasiphaeLaunchSystems/parts/s2/upper_diffuse
			}
		}
		SUBTYPE
		{
			name = orange
			title = Orange P.O.F.I
			primaryColor = #B1773C
			secondaryColor = #B1773C
			descriptionSummary = We left this thing out in the sun for a month and it turned orange. It's probably still safe to fly.
			TEXTURE
			{
				texture = PasiphaeLaunchSystems/parts/s2/paint_switches/orange
			}
		}
		SUBTYPE
		{
			name = blue
			title = Blue P.O.F.I
			primaryColor = #476B75
