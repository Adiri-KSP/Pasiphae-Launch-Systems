PART
{
	name = pasiphae_spix_avionics
	module = Part
	author = Adiri
	MODEL
	{
		model = PasiphaeLaunchSystems/parts/s2/spix_avionics
		rotation = 0, 0, 0
	}
	rescaleFactor = 1
	CrewCapacity = 0
	node_stack_top = 0.0, 0.217542, 0.0, 0.0, 1.0, 0.0, 1
	node_stack_bottom = 0.0, -0.217542, 0.0, 0.0, -1.0, 0.0, 1
	TechRequired = precisionPropulsion
	entryCost = 7500
	cost = 1750
	category = Pods
	subcategory  = 0
	title = Spix Avionics and Control System
	manufacturer = Pasiphae Launch Systems
	description = This is the perfect set of avionics for all your rockets. Built on our patented R.O.Z hardware (Remote Operation, Zero-delay), this baby can operate anywhere you want! (When in comms range)
	attachRules = 1,0,1,1,0
	mass = 0.7
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.15
	angularDrag = 1.5
	crashTolerance = 12
	maxTemp = 1200 // = 1200
	explosionPotential = 0
	vesselType = Probe
	
	tags = spix pasiphae PLS control avionics stage 2 pofi

	MODULE
	{
		name = ModuleCommand
		minimumCrew = 0
		RESOURCE
		{
			name = ElectricCharge
			rate = 0.020
		}
		hasHibernation = True
	}
	
	RESOURCE
	{
		name = ElectricCharge
		amount = 713.4
		maxAmount = 713.4
	}
	
	MODULE
	{
		name = ModuleReactionWheel
		PitchTorque = 2
		YawTorque = 2
		RollTorque = 2
		RESOURCE
		{
			name = ElectricCharge
			rate = 0.05
		}
	}

	MODULE 
    {
		name = ModuleSAS
		SASServiceLevel = 3
	}
	
	MODULE 
    {
		name = ModuleDataTransmitter
		antennaType = INTERNAL
		packetInterval = 1.0
		packetSize = 2
		packetResourceCost = 12.0
		requiredResource = ElectricCharge
		antennaPower = 5000
		optimumRange = 2500
		packetFloor = .1
		packetCeiling = 5
	}
	SHABBY_MATERIAL_REPLACE
	{
		materialDef = s2_resurfaced
		targetMaterial = s2_default
	}
}