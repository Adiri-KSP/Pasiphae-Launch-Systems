			TEXTURE
			{
				texture = PasiphaeLaunchSystems/parts/s2/paint_switches/blue
			}
		}
		SUBTYPE
		{
			name = white
			title = White Paint
			primaryColor = #c7c7c7
			secondaryColor = #c7c7c7
			descriptionSummary = We removed the foam from this one.
			TEXTURE
			{
				texture = PasiphaeLaunchSystems/parts/s2/paint_switches/white
			}
			TEXTURE
			{
				texture = PasiphaeLaunchSystems/parts/s2/paint_switches/upper_nrm_noPOFI
				isNormalMap = true
			}
