PART
{
	name = pasiphae_spix_interstage
	module = Part
	author = Adiri
	MODEL
	{
		model = PasiphaeLaunchSystems/parts/s2/spix_interstage
		rotation = 0, 0, 0
	}
	scale = 1
	rescaleFactor = 1
	node_stack_top = 0, 2.48448, 0, 0, 1, 0, 2
	node_stack_bottom = 0, -2.26501, 0, 0, -1, 0, 2
    stageOffset = 1
	childStageOffset = 1
    fx_gasBurst_white = 0.0, 0.8, 0.0, 0.0, 1.0, 0.0, decouple
	sound_vent_large = decouple
	TechRequired = generalRocketry
	entryCost = 1000
	cost = 450
	category = Coupling
	subcategory = 0
	title = Spix Interstage
	manufacturer = Pasiphae Launch Systems
	description = We designed this interstage to only fail 75% of the time!
	attachRules = 1,0,1,1,0
	mass = 0.75
	dragModelType = default
	maximum_drag = 0.7
	minimum_drag = 0.5
	angularDrag = 2
	crashTolerance = 7
	maxTemp = 2000 // = 3600
	breakingForce = 112
	breakingTorque = 112
	bulkheadProfiles = size2p8

	tags = spix, interstage, greeble, coupling, pls, pasiphae, ariane

   MODULE
	{
		name = ModuleDecouple
		ejectionForce = 350
		explosiveNodeID = top
	}
	MODULE
	{
		name = ModuleToggleCrossfeed
		crossfeedStatus = false
		toggleEditor = true
		toggleFlight = true
	}
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = meshSwitchrw
		switcherDescription = Raceway Toggle
		switcherDescriptionPlural = Raceway Toggle
		affectDragCubes = False
		affectFARVoxels = False
		SUBTYPE
		{
			name = rw
			title = Raceway Enabled
			secondaryColor = #a7a7a7
			descriptionSummary = The default option.
            transform = raceway
        }
		SUBTYPE
		{
			name = nrw
			title = No Raceway
			descriptionSummary = Remove that pesky raceway. Ideal for kitbashing. May sever connections.
        }
    }
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = meshSwitchlogo
        switcherDescription = Logo Toggle
        switcherDescriptionPlural = Logo Toggles
        affectDragCubes = False
        affectFARVoxels = False
        SUBTYPE
        {
            name = l
            title = Logos
            primaryColor = #1D2F63
            secondaryColor = #D03125
            descriptionSummary = Showing off our logos, awesome!
            transform = logo
        }
        SUBTYPE
        {
            name = nl
            title = No Logos
            descriptionSummary = No logos, good for kitbashing.
        }
	}
	SHABBY_MATERIAL_REPLACE
	{
		materialDef = s2_resurfaced
		targetMaterial = s2_default
	}
}