PART
{
	name = pasiphae_225_booster_long
	module = Part
	author = Adiri
	MODEL
	{
		model = PasiphaeLaunchSystems/parts/booster/spix_long_booster
		rotation = 0, 0, 0
	}
	rescaleFactor = 1
	node_stack_top = 0, 4.48959, 0, 0.0, 1, 0.0, 1
	TechRequired = flightControl
	entryCost = 10000
	cost = 3000
	category = Engine
	subcategory = 0
	title = Spix P-160 "Pelican" Solid Rocket Booster
	manufacturer = Pasiphae Launch Systems
	description = An upscaled version of the Goose, this booster packs in even more fuel!
	attachRules = 1,1,1,1,0
	mass = 6.7
	heatConductivity = 0.04 // 1/3 default
	skinInternalConductionMult = 4.0
	emissiveConstant = 0.5 // yes, it's white. But let's claim it's an emissive white...'
	dragModelType = default
	maximum_drag = 0.3
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 7
	maxTemp = 2000 // = 3600
	ActivatesEvenIfDisconnected = true
	stagingIcon = SOLID_BOOSTER
	bulkheadProfiles = size1p8
	breakingForce = 112
	breakingTorque = 112

	tags = p160, spix, booster, engine, pasiphae

	MODULE
	{
		name = ModuleEnginesFX
		thrustVectorTransformName = thrustTransform
		throttleLocked = True
		exhaustDamage = True
		ignitionThreshold = 0.1
		minThrust = 0
		maxThrust = 1071
		heatProduction = 400
		useEngineResponseTime = True
		engineAccelerationSpeed = 10.0
		allowShutdown = False
		fxOffset = 0, 0, 0.6
		EngineType = SolidBooster
		powerEffectName = running_solid

		PROPELLANT
		{
			name = SolidFuel
			ratio = 1.0
			DrawGauge = True
		}
		atmosphereCurve
		{
			key = 0 290
			key = 1 280
			key = 7 0.001
		}
	}

	RESOURCE
	{
		name = SolidFuel
		amount = 3927
		maxAmount = 3927
	}
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = meshSwitchStripe
		switcherDescription = Stripe Switch
		switcherDescriptionPlural = Stripe Switches
		affectDragCubes = False
		affectFARVoxels = False
		SUBTYPE
		{
			name = ns
			title = No Stripe
			secondaryColor = #FFFFFF
			descriptionSummary = The default option.
		}
		SUBTYPE
		{
			name = grey
			title = Blue Stripe
			secondaryColor = #31396B
			descriptionSummary = The classic blue stripe! May make your rocket fly faster.
			transform = stripe
		}
	}
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = meshSwitchSquare
		switcherDescription = Tracking Square Switch
		switcherDescriptionPlural = Tracking Square Switch
		affectDragCubes = False
		affectFARVoxels = False
		SUBTYPE
		{
			name = ns
			title = No Tracking Squares
			secondaryColor = #ffffff
			descriptionSummary = The default option.
		}
		SUBTYPE
		{
			name = ts
			title = Tracking Squares
			primaryColor = #FFFFFF
			secondaryColor = #2E2E2E
			descriptionSummary = A compliment of squares to help you with tracking your rocket.
			transform = squares
		}
	}
	MODULE
	{
		name = ModuleGimbal
		gimbalResponseSpeed = 5
		useGimbalResponseSpeed = true
		gimbalTransformName = gimbalTransform
		gimbalRange = 5
	}
	SHABBY_MATERIAL_REPLACE
	{
		materialDef = booster_resurfaced
		targetMaterial = booster_base
	}
	SHABBY_MATERIAL_REPLACE
	{
		materialDef = booster_resurfaced_switch
		targetMaterial = booster_base_switch
	}
}

