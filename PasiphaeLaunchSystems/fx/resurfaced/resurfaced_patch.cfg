SHABBY_MATERIAL_DEF
{
	name = s2_resurfaced

	shader = Resurfaced/Standard

	TEXTURE
	{
		_MetalMap = PasiphaeLaunchSystems/parts/s2/upper_metal
	}

	COLOR
	{
		_Color = #e1e1e1
	}

	FLOAT
	{
		_Metalness = 1.0
		_Smoothness  = 0.75
		_MetalAlbedoMultiplier = 1.15
	}
}

