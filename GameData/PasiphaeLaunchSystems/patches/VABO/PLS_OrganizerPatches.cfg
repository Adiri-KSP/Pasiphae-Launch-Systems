// Pods
@PART[pasiphae_spix_avionics]:NEEDS[VABOrganizer]{
	%VABORGANIZER{
		%organizerSubcategory = probes
	}
}

// Fuel Tanks
@PART[pasiphae_stage1_tank|pasiphae_stage2_tank]:NEEDS[VABOrganizer]{
	%VABORGANIZER{
		%organizerSubcategory = cryogenic
	}
}

// Engines
@PART[pasiphae_vinci]:NEEDS[VABOrganizer]{
	%VABORGANIZER{
		%organizerSubcategory = cryogenicEngines
	}
}
@PART[pasiphae_225_booster_short|pasiphae_225_booster_long]:NEEDS[VABOrganizer]{
	%VABORGANIZER{
		%organizerSubcategory = solidEngines
	}
}

// Coupling
@PART[pasiphae_spix_interstage]:NEEDS[VABOrganizer]{
	%VABORGANIZER{
		%organizerSubcategory = interstages
	}
}

// Aerodynamics
@PART[pasiphae_225_nclong|pasiphae_225_ncshort]:NEEDS[VABOrganizer]{
	%VABORGANIZER{
		%organizerSubcategory = noses
	}
}
